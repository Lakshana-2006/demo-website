<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <linearGradient id="teaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E55A00" />
    </linearGradient>
    <linearGradient id="steamGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF7009" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFA858" stop-opacity="0.2" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular White Emblem Backdrop -->
  <circle cx="100" cy="100" r="92" fill="#FFFFFF" stroke="#F4EDE4" stroke-width="4" />
  
  <!-- Subtle Inner Border Accent -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#FF7009" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 3" />

  <!-- Steam Ribbons Rising from the Tea Glass -->
  <!-- Left Steam Ribbon -->
  <path d="M84 76 C80 64, 88 54, 84 42 C82 36, 86 30, 88 26" 
        fill="none" 
        stroke="url(#steamGradient)" 
        stroke-width="3.5" 
        stroke-linecap="round" />
        
  <!-- Center Steam Ribbon (Taller) -->
  <path d="M100 73 C95 58, 106 48, 100 34 C97 27, 103 21, 102 16" 
        fill="none" 
        stroke="url(#steamGradient)" 
        stroke-width="4" 
        stroke-linecap="round" />
        
  <!-- Right Steam Ribbon -->
  <path d="M116 76 C120 64, 112 54, 116 42 C118 36, 114 30, 112 26" 
        fill="none" 
        stroke="url(#steamGradient)" 
        stroke-width="3.5" 
        stroke-linecap="round" />

  <!-- Traditional Cutting Chai Glass Outline & Body -->
  <!-- Glass Rim Top Oval -->
  <ellipse cx="100" cy="80" rx="35" ry="6" fill="#FFF2E2" stroke="#FF7009" stroke-width="2.5" />

  <!-- Glass Body (Tapered Chai Tumbler) -->
  <path d="M68 81 L76 142 C77 148, 82 153, 89 153 L111 153 C118 153, 123 148, 124 142 L132 81 Z" 
        fill="#FFFFFF" 
        stroke="#FF7009" 
        stroke-width="3" 
        stroke-linejoin="round" />

  <!-- Tea Liquid Inside Glass -->
  <path d="M72 95 L76 141 C76.5 145, 80 148, 88 148 L112 148 C120 148, 123.5 145, 124 141 L128 95 Q100 102 72 95 Z" 
        fill="url(#teaGradient)" />

  <!-- Tea Surface Curve -->
  <ellipse cx="100" cy="95" rx="28" ry="4" fill="#FFA538" />

  <!-- Glass Vertical Ribs (Authentic Cutting Chai Glass Facets) -->
  <line x1="86" y1="99" x2="88" y2="145" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" />
  <line x1="100" y1="100" x2="100" y2="146" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" />
  <line x1="114" y1="99" x2="112" y2="145" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" />

  <!-- Glass Base Stand -->
  <ellipse cx="100" cy="154" rx="16" ry="3" fill="#E55A00" opacity="0.3" />
</svg>

